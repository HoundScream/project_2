name: Deploy to Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          DEPLOY_HOST_SECRET: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER_SECRET: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY_SECRET: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT_SECRET: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST_SECRET:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER_SECRET:?missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY_SECRET:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_PORT_SECRET:?missing DEPLOY_PORT}"

      - name: Create release archive
        run: |
          tar \
            --exclude-vcs \
            --exclude='.env' \
            --exclude='target' \
            -czf geonetix.tar.gz .

      - name: Upload archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "geonetix.tar.gz"
          target: "/tmp"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="/opt/geonetix"
            ARCHIVE_PATH="/tmp/geonetix.tar.gz"
            TMP_DIR="$(mktemp -d)"
            trap 'rm -rf "${TMP_DIR}"' EXIT

            mkdir -p "${APP_DIR}"
            tar -xzf "${ARCHIVE_PATH}" -C "${TMP_DIR}"
            chmod +x "${TMP_DIR}/deploy/deploy.sh"

            "${TMP_DIR}/deploy/deploy.sh" "${ARCHIVE_PATH}"
            rm -f "${ARCHIVE_PATH}"
